name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tested dependencies
        run: python -m pip install -r requirements-reference.txt

      - name: Run the test suite
        run: python -B -X utf8 -m pytest -q -p no:cacheprovider tests
